name: Manual Workflow

on:
  workflow_dispatch:

env:
  TITLE: 'Mr.'

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - name: Generate version
        id: version_step
        run: echo "version=2.0.0" >> $GITHUB_OUTPUT

      - name: Use version output
        run: echo "Version is ${{ steps.version_step.outputs.version }}"
