name: Manual Workflow

on:
  workflow_dispatch:

env:
  TITLE: 'Mr.'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - id: version
        run: echo "version=3.0.0" >> $GITHUB_OUTPUT
    outputs:
      app_version: ${{ steps.version.outputs.version }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - run: echo "Deploying version ${{ needs.build.outputs.app_version }}"
