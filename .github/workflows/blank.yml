name: GITHUB_ENV Demo

on: push

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - name: Set environment variable
        run: echo "APP_VERSION=1.2.3" >> $GITHUB_ENV

      - name: Use environment variable
        run: |
          echo "Version is $APP_VERSION"
          echo "Version is ${{APP_VERSION}}"

        
