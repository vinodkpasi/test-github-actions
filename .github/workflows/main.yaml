name: CI Pipeline

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Building..."

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - run: echo "Running tests..."

  security-scan:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - run: echo "Security Scan..."

  deploy:
    runs-on: ubuntu-latest
    needs:
      - test
      - security-scan
    steps:
      - run: echo "Deploying..."
